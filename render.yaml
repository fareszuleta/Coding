services:
  - type: web
    name: nexo-platform-demo
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'"
      - path: /downloads/*.zip
        name: Content-Disposition
        value: attachment
